<style>
  :root {
    --bg: #0c1220;
    --panel: #151f34;
    --border: #2a3b5c;
    --gold: #ffd166;
    --text: #e6eefc;
    --muted: #93a8c9;
    --accent: #3b82f6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Pretendard", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  header {
    max-width: 1280px;
    margin: 0 auto 20px;
    padding: 20px 24px;
    background: linear-gradient(135deg, #16223a, #0f172a);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  h1 { margin: 0 0 8px; color: var(--gold); font-size: 24px; }
  p.sub { margin: 0; color: var(--muted); font-size: 14px; }
  .toolbar {
    max-width: 1280px;
    margin: 0 auto 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  .tab {
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
  }
  .tab.active {
    background: var(--gold);
    color: #0c1220;
    border-color: var(--gold);
  }
  input[type="search"] {
    flex: 1;
    min-width: 220px;
    padding: 9px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 14px;
  }
  .grid {
    max-width: 1280px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(156px, 1fr));
    gap: 12px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    text-align: center;
    transition: transform 0.12s, border-color 0.12s;
  }
  .card:hover {
    transform: translateY(-2px);
    border-color: var(--gold);
  }
  .card img {
    image-rendering: pixelated;
    max-width: 100%;
    height: auto;
    border-radius: 4px;
    border: 1px solid #000;
    background: #000;
  }
  .card .title {
    margin-top: 8px;
    font-weight: 700;
    font-size: 13px;
    color: var(--gold);
  }
  .card .meta {
    margin-top: 4px;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.4;
  }
  table.code-table {
    width: 100%;
    max-width: 1280px;
    margin: 0 auto 24px;
    border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  table.code-table th, table.code-table td {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    text-align: left;
  }
  table.code-table th {
    background: #1c2944;
    color: var(--gold);
  }
</style>
</head>

let currentTab = "all";
const qInput = document.getElementById("q");
const content = document.getElementById("content");

const SHIP_NAMES = [
  "발사", "한자 콕", "다우", "버스", "타렛테",
  "카라벨 라티나", "카라벨 레돈다", "브리간틴", "나오", "카락",
  "갤리온", "지벡", "파네스", "슬루프", "프리게이트",
  "바그", "쉽", "정크", "경갤리", "플랜더스 갤리",
  "베네치안 갤리", "라 레아르", "철갑선", "안택선", "관선"
];

function itemNameForAsset(a) {
  if (a.control_name === "img_item" && DATA.items[a.control_index]) {
    return `${DATA.items[a.control_index].name} (아이템 #${a.control_index})`;
  }
  if (a.control_name === "img_face") {
    return `안면/파생 아이콘 (img_face #${a.control_index})`;
  }
  if (a.control_name === "img_ship" && SHIP_NAMES[a.control_index]) {
    return `${SHIP_NAMES[a.control_index]} (함선 #${a.control_index})`;
  }
  if (a.control_name === "img_char") {
    return `인물 초상 (img_char #${a.control_index})`;
  }
  return a.filename.split("/").pop();
}

function render() {
  const q = qInput.value.trim().toLowerCase();
  if (currentTab === "tables") {
    const sections = [
      { title: "🗡️ 아이템 코드표 (100종)", rows: DATA.items, cols: ["id", "name", "offset"] },
      { title: "📦 교역품 코드표 (46종)", rows: DATA.trade_goods, cols: ["id", "name", "offset"] },
      { title: "💣 대포 코드표 (8종)", rows: DATA.cannons, cols: ["id", "name", "horiedit_code", "offset"] },
      { title: "🧜 선수상 코드표 (11종)", rows: DATA.figureheads, cols: ["id", "name", "horiedit_code", "offset"] },
      { title: "👑 작위 코드표 (10종)", rows: DATA.ranks, cols: ["id", "name", "offset"] },
      { title: "🚩 국가 코드표 (7종)", rows: DATA.nations, cols: ["id", "name", "offset"] },
    ];
    content.innerHTML = sections.map(sec => {
      const filtered = sec.rows.filter(r => !q || JSON.stringify(r).toLowerCase().includes(q));
      return `<table class="code-table"><thead><tr><th colspan="${sec.cols.length}">${sec.title} (${filtered.length}건)</th></tr><tr>${sec.cols.map(c => `<th>${c}</th>`).join("")}</tr></thead><tbody>${filtered.map(r => `<tr>${sec.cols.map(c => `<td>${r[c] ?? ""}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
    }).join("");
    return;
  }
  const list = DATA.assets.filter(a => {
    if (currentTab !== "all" && a.category !== currentTab) return false;
    if (!q) return true;
    const label = itemNameForAsset(a).toLowerCase();
    return label.includes(q) || a.filename.toLowerCase().includes(q) || String(a.global_index).includes(q) || a.control_name.toLowerCase().includes(q);
  });
  content.innerHTML = `<div class="grid">${list.map(a => `
    <div class="card">
      <img src="${a.filename}" alt="${a.filename}" loading="lazy" />
      <div class="title">${itemNameForAsset(a)}</div>
      <div class="meta">
        #${a.global_index} (${a.category} #${a.index})<br/>
        ${a.width}×${a.height} · 0x${a.file_offset.toString(16)}<br/>
        <code>${a.control_name}[${a.control_index}]</code>
      </div>
    </div>
  `).join("")}</div>`;
}

document.querySelectorAll(".tab").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentTab = btn.dataset.tab;
    render();
  });
});
qInput.addEventListener("input", render);
render();
</script>
